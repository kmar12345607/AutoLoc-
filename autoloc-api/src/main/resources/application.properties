spring.application.name=autoloc-api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.servlet.context-path=/api

#  : liste déroulante "Select a definition"
springdoc.swagger-ui.groups-order=ASC
springdoc.group-configs[0].group=Tous
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[1].group=Agences
springdoc.group-configs[1].paths-to-match=/agences/**
springdoc.group-configs[2].group=Clients
springdoc.group-configs[2].paths-to-match=/clients/**
springdoc.group-configs[3].group=Contrats
springdoc.group-configs[3].paths-to-match=/contrats/**
springdoc.group-configs[4].group=Employes
springdoc.group-configs[4].paths-to-match=/employes/**
springdoc.group-configs[5].group=Equipements
springdoc.group-configs[5].paths-to-match=/equipements/**
springdoc.group-configs[6].group=Maintenances
springdoc.group-configs[6].paths-to-match=/maintenances/**
springdoc.group-configs[7].group=Paiements
springdoc.group-configs[7].paths-to-match=/paiements/**
springdoc.group-configs[8].group=Reservations
springdoc.group-configs[8].paths-to-match=/reservations/**
springdoc.group-configs[9].group=Vehicules
springdoc.group-configs[9].paths-to-match=/vehicules/**